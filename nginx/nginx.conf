events {
}

http {
    resolver 127.0.0.11 valid=5s;

    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;
    proxy_intercept_errors off;

    server {
        listen 8080;

        error_page 502 504 =503 @dependency_unavailable;

        location = /search {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location = /search/filters {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location /books/ {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location @dependency_unavailable {
            default_type "application/problem+json; charset=utf-8";
            add_header Retry-After 5 always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"DEPENDENCY_UNAVAILABLE","detail":"No upstream replica is available"}';
        }

        location / {
            default_type "application/problem+json; charset=utf-8";
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"The requested path does not exist"}';
        }
    }

    server {
        listen 8081;

        error_page 502 504 =503 @dependency_unavailable;

        location /ingest/ {
            set $crawler http://crawler:7001;
            proxy_pass $crawler;
        }

        location /index/ {
            set $indexer http://indexer:7002;
            proxy_pass $indexer;
        }

        location /control/ {
            set $control http://control:7004;
            proxy_pass $control;
        }

        location @dependency_unavailable {
            default_type "application/problem+json; charset=utf-8";
            add_header Retry-After 5 always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"DEPENDENCY_UNAVAILABLE","detail":"No upstream replica is available"}';
        }

        location / {
            default_type "application/problem+json; charset=utf-8";
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"The requested path does not exist"}';
        }
    }
}
