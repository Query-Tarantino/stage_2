events {
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8080;

        location = /search {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location = /search/filters {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location /books/ {
            set $query http://query:7003;
            proxy_pass $query;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;

        location /ingest/ {
            set $crawler http://crawler:7001;
            proxy_pass $crawler;
        }

        location /index/ {
            set $indexer http://indexer:7002;
            proxy_pass $indexer;
        }

        location /control/ {
            set $control http://control:7004;
            proxy_pass $control;
        }

        location / {
            return 404;
        }
    }
}
