services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  hazelcast:
    image: hazelcast/hazelcast:5.7.0
    environment:
      HZ_CLUSTERNAME: tarantino

volumes:
  mongo-data:
